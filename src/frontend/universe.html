<!doctype html><html><head><meta charset="utf-8"><title>Universe preview</title></head>
<body style="margin:0;background:#02030a">
<div id="root" class="labmap" style="position:fixed;inset:0;height:100vh"><div id="stage" class="labmap-stage" style="position:absolute;inset:0;height:100%"><div id="plates" class="labmap-plates"></div></div></div>
<script type="module">
import './src/index.css'
import './src/LabMap.css'
import { layoutLab, parseLabMap, parseLabMapLive, dominant, routeOf } from './src/labMapModel'
import { UniverseScene } from './src/UniverseScene'
const [m, l] = await Promise.all([fetch('/_fixtures/map.json').then(r => r.json()), fetch('/_fixtures/live.json').then(r => r.json())])
const map = parseLabMap(m), live = parseLabMapLive(l)
const sites = live.destinations.map(d => ({ id: d.id, name: d.name, category: d.category, chosen: d.chosen, service: dominant(d.mix), org: d.org, domains: d.domains, peak: d.bps }))
const layout = layoutLab(map, sites)
const scene = new UniverseScene(document.getElementById('stage'), document.getElementById('plates'), { select: id => scene.select(id, id ? routeOf(layout, id) : []) })
window.scene = scene
scene.setLayout(layout); scene.setLive(live)
</script></body></html>
