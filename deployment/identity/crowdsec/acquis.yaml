# The gateway's JSON access log. The gateway truncates it in place at 50 MB; the file source notices and reads from the start.
source: file
filenames:
  - /var/log/traefik/access.log
labels:
  type: traefik
---
# AppSec: the gateway's bouncer asks here before passing a request on, on the Docker network only.
source: appsec
listen_addr: 0.0.0.0:7422
appsec_configs:
  - crowdsecurity/appsec-default
labels:
  type: appsec
