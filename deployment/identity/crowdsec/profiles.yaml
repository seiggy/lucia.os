# Lucia's remediation policy for alerts from the gateway's access log and AppSec. Profiles run in order and the first match
# decides. Safe-harbor addresses never get here: the engine's lucia-safe-harbor allowlist drops their alerts first.

# Cloudflare's proxies carry every public visitor. The access log and the bouncer both name the visitor, so a scenario should
# never see a proxy; if one does, it's recorded and never banned. Keep in step with DomainIngressConfiguration.CloudflareRanges.
name: lucia_cloudflare_never_banned
filters:
  - >-
    Alert.GetScope() == "Ip" && (
      IpInRange(Alert.GetValue(), '173.245.48.0/20') ||
      IpInRange(Alert.GetValue(), '103.21.244.0/22') ||
      IpInRange(Alert.GetValue(), '103.22.200.0/22') ||
      IpInRange(Alert.GetValue(), '103.31.4.0/22') ||
      IpInRange(Alert.GetValue(), '141.101.64.0/18') ||
      IpInRange(Alert.GetValue(), '108.162.192.0/18') ||
      IpInRange(Alert.GetValue(), '190.93.240.0/20') ||
      IpInRange(Alert.GetValue(), '188.114.96.0/20') ||
      IpInRange(Alert.GetValue(), '197.234.240.0/22') ||
      IpInRange(Alert.GetValue(), '198.41.128.0/17') ||
      IpInRange(Alert.GetValue(), '162.158.0.0/15') ||
      IpInRange(Alert.GetValue(), '104.16.0.0/13') ||
      IpInRange(Alert.GetValue(), '104.24.0.0/14') ||
      IpInRange(Alert.GetValue(), '172.64.0.0/13') ||
      IpInRange(Alert.GetValue(), '131.0.72.0/22'))
on_success: break
---
# The LAN and other private addresses: the alert is recorded and nothing is banned automatically. A ban by hand (cscli
# decisions add, or the CrowdSec Console) still applies.
name: lucia_private_alert_only
filters:
  - >-
    Alert.GetScope() == "Ip" && (
      IpInRange(Alert.GetValue(), '10.0.0.0/8') ||
      IpInRange(Alert.GetValue(), '172.16.0.0/12') ||
      IpInRange(Alert.GetValue(), '192.168.0.0/16') ||
      IpInRange(Alert.GetValue(), '127.0.0.0/8') ||
      IpInRange(Alert.GetValue(), '169.254.0.0/16') ||
      IpInRange(Alert.GetValue(), '100.64.0.0/10') ||
      IpInRange(Alert.GetValue(), '::1/128') ||
      IpInRange(Alert.GetValue(), 'fc00::/7') ||
      IpInRange(Alert.GetValue(), 'fe80::/10'))
on_success: break
---
# A range could cover the LAN or a proxy, so range alerts are recorded only. The community blocklist still bans ranges.
name: lucia_range_alert_only
filters:
  - Alert.GetScope() == "Range"
on_success: break
---
# Every other address is on the internet: banned for 4 hours the first time, a day the second, then a week, counting the
# address's decisions from the last 30 days (config.yaml.local keeps alerts and their decisions that long).
name: lucia_public_escalating_ban
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
duration_expr: >-
  GetDecisionsSinceCount(Alert.GetValue(), '720h') < 1 ? '4h' :
  (GetDecisionsSinceCount(Alert.GetValue(), '720h') < 2 ? '24h' : '168h')
on_success: break
